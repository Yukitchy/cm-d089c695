<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Before your Pokémon Tour — 2 minutes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fbf9f6;--ink:#1c1c1c;--acc:#d6336c;--card:#fff;--sub:#5d5d5d}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-weight:500;line-height:1.7;font-size:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:36px 20px 56px}
h1{font-size:27px;font-weight:900;line-height:1.35;margin-bottom:10px}
.lead{font-size:15px;color:var(--sub);margin-bottom:24px}

.f{background:var(--card);border-radius:16px;padding:20px;margin-bottom:14px}
.q{display:block;font-size:16px;font-weight:900;line-height:1.5;margin-bottom:10px}
input[type=text],textarea,select{width:100%;font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);background:#f3f0ec;border:0;border-radius:12px;padding:13px 14px;line-height:1.6;-webkit-appearance:none;appearance:none}
select{background-image:none}
textarea{min-height:82px;resize:vertical}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:flex-start;gap:10px;font-size:16px;line-height:1.6;padding:8px 2px;cursor:pointer}
.opt input{width:21px;height:21px;margin-top:2px;flex:0 0 auto;accent-color:var(--acc)}

button{display:block;width:100%;background:var(--acc);color:#fff;font-family:inherit;font-weight:900;font-size:17px;border:0;border-radius:14px;padding:16px;cursor:pointer;line-height:1.4}
#out{display:none;margin-top:18px}
#out .f{margin-bottom:12px}
#sum{min-height:170px;font-size:15px;line-height:1.7}
.note{font-size:13px;color:var(--sub);text-align:center;margin-top:28px;line-height:1.7}
.nw{white-space:nowrap}
.ok{font-size:14px;color:var(--acc);font-weight:900;text-align:center;margin-top:10px;min-height:20px}
</style>
</head>
<body>
<div class="wrap">

<h1>Before your Pokémon Tour<br>— 2 minutes</h1>
<p class="lead">Answer these and your guide can plan the day around what you actually want.</p>

<form id="form" onsubmit="return false">

  <div class="f"><label class="q" for="name">Name</label>
    <input type="text" id="name" autocomplete="name" placeholder="Your name"></div>

  <div class="f"><label class="q" for="fav">Favorite Pokémon</label>
    <input type="text" id="fav" placeholder="e.g. Gengar"></div>

  <div class="f"><span class="q">What do you collect?</span>
    <div class="opts">
      <label class="opt"><input type="checkbox" class="col" value="Trading cards"><span>Trading cards</span></label>
      <label class="opt"><input type="checkbox" class="col" value="Plush"><span>Plush</span></label>
      <label class="opt"><input type="checkbox" class="col" value="Figures"><span>Figures</span></label>
      <label class="opt"><input type="checkbox" class="col" value="Games"><span>Games</span></label>
      <label class="opt"><input type="checkbox" class="col" value="Just looking"><span>Just looking</span></label>
    </div></div>

  <div class="f"><span class="q">Do you play the Pokémon TCG?</span>
    <div class="opts">
      <label class="opt"><input type="radio" name="tcg" value="Yes"><span>Yes</span></label>
      <label class="opt"><input type="radio" name="tcg" value="No"><span>No</span></label>
      <label class="opt"><input type="radio" name="tcg" value="Used to"><span>Used to</span></label>
    </div></div>

  <div class="f"><label class="q" for="budget">Budget for shopping</label>
    <select id="budget">
      <option value="">Select one</option>
      <option>under ¥5,000</option>
      <option>¥5,000–15,000</option>
      <option>¥15,000–30,000</option>
      <option>no limit</option>
    </select></div>

  <div class="f"><label class="q" for="must">Anything you must see or buy?</label>
    <textarea id="must" placeholder="e.g. Pokémon Center Yokohama"></textarea></div>

  <div class="f"><label class="q" for="notes">Allergies or notes</label>
    <textarea id="notes" placeholder="Anything your guide should know"></textarea></div>

  <button type="button" id="make">Make my summary</button>
</form>

<div id="out">
  <div class="f">
    <span class="q">Your summary</span>
    <textarea id="sum" readonly></textarea>
  </div>
  <button type="button" id="copy">Copy</button>
  <p class="ok" id="ok"></p>
</div>

<p class="note">Send this to your guide YUKA on Instagram <span class="nw">@japow.lifeinjapan</span></p>

</div>
<script>
function val(id){return document.getElementById(id).value.trim()||'-';}
document.getElementById('make').onclick=function(){
  var col=[].slice.call(document.querySelectorAll('.col:checked')).map(function(c){return c.value;});
  var tcg=document.querySelector('input[name=tcg]:checked');
  var s='Name: '+val('name')
    +' / Fav: '+val('fav')
    +' / Collects: '+(col.length?col.join(', '):'-')
    +' / TCG: '+(tcg?tcg.value:'-')
    +' / Budget: '+(document.getElementById('budget').value||'-')
    +' / Must: '+val('must')
    +' / Notes: '+val('notes');
  document.getElementById('sum').value=s;
  document.getElementById('out').style.display='block';
  document.getElementById('ok').textContent='';
  document.getElementById('out').scrollIntoView({behavior:'smooth'});
};
document.getElementById('copy').onclick=function(){
  var t=document.getElementById('sum'),ok=document.getElementById('ok');
  function fallback(){try{t.removeAttribute('readonly');t.focus();t.select();t.setSelectionRange(0,99999);document.execCommand('copy');t.setAttribute('readonly','');ok.textContent='Copied.';}catch(e){ok.textContent='Please select the text above and copy it.';}}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(function(){ok.textContent='Copied.';},fallback);
  }else{fallback();}
};
</script>
</body>
</html>
