<style>
:root{--ink:#141210;--paper:#FFFCF2;--accent:#FFE600;--link:#1F5FBF;--sub:#6B6659;
  --shelf:#E7D8B8;--shadow:4px 4px 0 var(--ink);
  --round:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Zen Maru Gothic",
    -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:24px 16px 64px;line-break:strict;word-break:normal;overflow-wrap:normal;}
.wrap{max-width:1040px;margin:0 auto;}
header.top{border:3px solid var(--ink);background:var(--accent);box-shadow:var(--shadow);
  border-radius:14px;padding:20px 22px;margin-bottom:22px;position:relative;overflow:hidden;}
header.top::after{content:"";position:absolute;right:-70px;top:-70px;width:210px;height:210px;
  border-radius:50%;background:rgba(255,255,255,.45);}
header.top h1{margin:0;font-size:34px;letter-spacing:1px;font-family:var(--round);
  font-weight:800;position:relative;text-shadow:3px 3px 0 rgba(255,255,255,.6);}
header.top .lead{margin:8px 0 0;font-size:14.5px;font-weight:700;position:relative;line-height:1.5;}
header.top p.count{margin:8px 0 0;font-size:12.5px;font-weight:700;color:#5c5647;position:relative;}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.cta-btn{border:3px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;font-size:14px;
  border-radius:10px;padding:9px 15px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);}
.cta-btn.primary{background:var(--ink);color:var(--accent);}
.cta-btn:active{transform:translate(2px,2px);box-shadow:none;}
.skillbox{margin-top:14px;border:3px solid var(--ink);background:#fff;border-radius:12px;padding:12px;}
.skillbox .ttl{font-size:12px;font-weight:800;margin-bottom:8px;}
.skgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.skf{display:flex;flex-direction:column;gap:3px;min-width:0;}
.skf label{font-size:11px;font-weight:800;color:#555;}
.skf .req{color:#A32D2D;}
.skf input{border:2px solid var(--ink);border-radius:7px;padding:6px 8px;font-size:13px;width:100%;
  box-sizing:border-box;background:#fff;}
@media(max-width:560px){.skgrid{grid-template-columns:repeat(2,1fr);}}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;}
#q{flex:1;min-width:200px;border:3px solid var(--ink);border-radius:10px;padding:10px 14px;
  font-size:15px;background:#fff;box-shadow:var(--shadow);}
.chip{border:3px solid var(--ink);background:#fff;border-radius:999px;padding:6px 13px;
  font-size:13px;font-weight:700;cursor:pointer;user-select:none;}
.chip.on{background:var(--ink);color:var(--accent);}
.cat{margin:30px 0 14px;display:flex;align-items:center;gap:10px;}
.cat h2{display:inline-block;margin:0;font-size:19px;background:var(--ink);color:var(--accent);
  padding:5px 14px;border-radius:8px;transform:rotate(-1deg);font-family:var(--round);font-weight:800;}
.cat .count{font-size:13px;font-weight:700;color:var(--sub);}
/* 本棚: 作品の行が板の上に並ぶ */
.shelf{border:3px solid var(--ink);background:#fff;border-radius:14px;box-shadow:var(--shadow);
  overflow:hidden;}
.row{display:grid;grid-template-columns:118px 1fr;gap:18px;padding:18px;position:relative;
  border-bottom:3px solid var(--ink);background:#fff;transition:background .12s;}
.row:last-child{border-bottom:0;}
.row:hover{background:#FFFBEA;}
.cover{position:relative;align-self:start;}
.cover svg{display:block;width:100%;height:auto;border:2.5px solid var(--ink);border-radius:5px;
  box-shadow:3px 3px 0 rgba(20,18,16,.22);}
.body{min-width:0;display:flex;flex-direction:column;gap:7px;}
.rt{margin:0;font-size:19px;line-height:1.45;font-weight:800;color:var(--link);
  font-family:var(--round);cursor:default;}
.row.hasnew .rt{padding-right:104px;}   /* 🆕新連載リボンとタイトルの衝突よけ */
.byline{font-size:12.5px;font-weight:700;color:var(--sub);}
.byline b{color:var(--ink);font-weight:800;}
.syn{font-size:13.5px;line-height:1.72;margin:0;color:#33302a;}
.newrib{position:absolute;top:10px;right:10px;background:#E24B4A;color:#fff;font-size:10.5px;
  font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;transform:rotate(4deg);
  box-shadow:2px 2px 0 var(--ink);z-index:2;}
.chip.present.on{background:#A32D2D;color:#fff;border-color:#A32D2D;}
.metaline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11px;font-weight:700;
  color:#b0aa99;}
.badge{font-size:11px;font-weight:800;border:2px solid var(--ink);border-radius:999px;
  padding:2px 10px;white-space:nowrap;}
.tags{display:flex;flex-wrap:wrap;gap:5px;}
.tag{font-size:10.5px;font-weight:700;background:#f5f2e8;border:1.5px solid #d9d3c2;border-radius:6px;
  padding:1px 8px;color:#6a6353;}
.path{font-size:10.5px;color:#b0aa99;font-family:ui-monospace,Menlo,monospace;word-break:break-all;}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:3px;}
.go{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:3px solid var(--ink);background:var(--accent);color:var(--ink);font-weight:800;
  font-size:13.5px;border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none;
  box-shadow:2px 2px 0 var(--ink);}
.go:active{transform:translate(2px,2px);box-shadow:none;}
.go.muted{background:#fff;}
.empty{text-align:center;color:#999;font-weight:700;padding:40px;}
@media(max-width:560px){
  .row{grid-template-columns:82px 1fr;gap:13px;padding:14px;}
  .rt{font-size:16.5px;}
}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:var(--accent);font-weight:800;border-radius:10px;padding:12px 20px;
  box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:9;font-size:14px;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
footer{margin-top:40px;text-align:center;font-size:12px;color:#aaa;}
</style></head>

function buildSkillPrompt(){

function matches(it){

/* ===== 表紙: 本物のラノベ文庫の装丁を再現する =====

   ・タイトルは2層: 核となる短い言葉を極大の縦組 + 全文を細い小さな縦組で脇に流す
   ・多重の縁取り（外側の白グロー→濃色→細い縁）でどんな絵の上でも白抜きが読める
   ・はみ出しは構造的に起こらない（列数と文字サイズを available から逆算し、最後は省略） */
const CW=300, CH=438;                      // 1 : 1.46

const SYM=/[、。，．,.「」『』【】（）()・゠･…‥！？!?：:；;〜~～－—–―　\s"'“”‘’]/g;
function shade(hex,f){
  const h=String(hex||'#3A6EA5').replace('#','');
  const s=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const n=parseInt(s,16)||0;
  const ch=[(n>>16)&255,(n>>8)&255,n&255]
    .map(v=>Math.max(0,Math.min(255,Math.round(v*f))).toString(16).padStart(2,'0'));
  return '#'+ch.join('');
}
// 縦組み1列 = <text> 1個 + <tspan dy> （1文字1要素にすると167表紙でDOMが重くなる）
function vcol(chars,x,y0,size,step,attrs){
  if(!chars.length) return '';
  return `<text x="${x}" y="${y0}" font-size="${size}" text-anchor="middle" `
    +`dominant-baseline="central" ${attrs}>`
    +chars.map((ch,i)=>`<tspan x="${x}"${i?` dy="${step}"`:''}>${escapeHtml(ch)}</tspan>`).join('')
    +'</text>';
}
function coverSvg(it){
  const c=it.cover||{};
  const bg=c.bg||'#3A6EA5', acc=c.accent||'#FFD84D', glyph=c.glyph||it.emoji||'📕';
  const u='cv'+String(it.id||'x').replace(/[^A-Za-z0-9_-]/g,'');
  const title=it.ranobe_title||it.name||'';
  const full=String(title).replace(SYM,'');
  // cover_main（別途付与される核の4〜8文字）が無い間は全文の頭から機械的に切り出す。
  // 英数字は縦組みで1文字ずつ縦に積まれて崩れるので、切り出しは日本語部分から取る。
  let main=String(it.cover_main||'').replace(SYM,'').slice(0,8);
  if(!main){
    const ja=full.replace(/[A-Za-z0-9]/g,'');
    main=(ja||full).slice(0,6).replace(/[をがのにはでともへやり]$/,'');   // 語尾の助詞は落とす
  }
  if(!main) main=String(it.name||'作').replace(SYM,'').slice(0,6)||'作';

  const mchars=[...main], n=mchars.length;
  const mcols=n>5?2:1, per=Math.ceil(n/mcols);
  const ms=Math.min(74,Math.floor(availH/per));       // 表紙幅の約1/4

  const my0=PT+ms*0.55;
  const mlayer=a=>{let o='';for(let k=0;k<mcols;k++)
    o+=vcol(mchars.slice(k*per,(k+1)*per),mRight-mColW*k-mColW/2,my0,ms,ms,a);return o;};
  const mbase=`font-weight="900" font-family='${F_HEAVY}' stroke-linejoin="round"`;
  const mainT=mlayer(`${mbase} fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="${(ms*0.22).toFixed(1)}"`)
    +mlayer(`${mbase} fill="none" stroke="${shade(bg,.26)}" stroke-width="${(ms*0.14).toFixed(1)}"`)
    +mlayer(`${mbase} fill="#fff" stroke="${shade(bg,.45)}" stroke-width="${(ms*0.05).toFixed(1)}" paint-order="stroke"`);

  // --- 全文: 細く小さい縦組を核の脇に2〜3列。入る列数と文字サイズを先に確定させる ---
  const sRight=mLeft-9, sAvailW=sRight-11;
  const colsFor=s=>Math.max(1,Math.min(3,Math.floor(sAvailW/(s*1.18))));

  let subT='';
  for(let j=0;j<scols;j++){
    const part=sarr.slice(j*cap,(j+1)*cap); if(!part.length) break;
    subT+=vcol(part,sRight-ss*0.59-j*(ss*1.18),PT+ss*0.6,ss,ss*1.1,
      `font-weight="700" font-family='${F_THIN}' fill="#fff" stroke="${shade(bg,.28)}" `
      +`stroke-width="${(ss*0.3).toFixed(1)}" paint-order="stroke" stroke-linejoin="round"`);
  }

  // --- 絵: art があれば全面に敷く。無ければ情景+キャラの影+絵文字でフォールバック ---
  const art=it.art_data
    ? `<image href="${escapeAttr(it.art_data)}" x="0" y="0" width="${CW}" height="${CH-CBAND}" preserveAspectRatio="xMidYMid slice"/>`
    : `<g opacity=".4" fill="${shade(bg,.3)}"><path d="M34 ${CH-CBAND} q6 -78 74 -92 q68 14 74 92 Z"/></g>
<circle cx="108" cy="256" r="44" fill="${shade(bg,.34)}" opacity=".4"/>
<circle cx="108" cy="256" r="41" fill="#fff" opacity=".2"/>
<text x="108" y="257" font-size="62" text-anchor="middle" dominant-baseline="central">${escapeHtml(glyph)}</text>`;

  const nm=it.name||'';
  const author=nm.length>12?nm.slice(0,12)+'…':nm;
  const cat=it.category||'';
  return `<svg viewBox="0 0 ${CW} ${CH}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${escapeAttr(title)}">
<defs>
<linearGradient id="${u}s" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="${shade(bg,1.66)}"/><stop offset=".4" stop-color="${shade(bg,1.14)}"/>
<stop offset=".72" stop-color="${shade(bg,.88)}"/><stop offset="1" stop-color="${shade(bg,.5)}"/></linearGradient>
<radialGradient id="${u}g" cx=".3" cy=".26" r=".6">
<stop offset="0" stop-color="${escapeAttr(acc)}" stop-opacity=".9"/>
<stop offset=".5" stop-color="${escapeAttr(acc)}" stop-opacity=".24"/>
<stop offset="1" stop-color="${escapeAttr(acc)}" stop-opacity="0"/></radialGradient>
<linearGradient id="${u}v" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="${shade(bg,.22)}" stop-opacity="0"/>
<stop offset=".55" stop-color="${shade(bg,.22)}" stop-opacity=".18"/>
<stop offset="1" stop-color="${shade(bg,.22)}" stop-opacity=".62"/></linearGradient>
<clipPath id="${u}c"><rect x="0" y="0" width="${CW}" height="${CH-CBAND}"/></clipPath>
</defs>
<g clip-path="url(#${u}c)">
<rect width="${CW}" height="${CH}" fill="url(#${u}s)"/>
<g opacity=".14" fill="#fff"><path d="M88 112 L330 -40 L352 44 Z"/><path d="M88 112 L344 96 L336 158 Z"/>
<path d="M88 112 L214 -60 L268 -34 Z"/></g>
<circle cx="240" cy="74" r="30" fill="#fff" opacity=".13"/><circle cx="272" cy="150" r="17" fill="#fff" opacity=".16"/>
<circle cx="46" cy="60" r="21" fill="#fff" opacity=".12"/><circle cx="196" cy="196" r="12" fill="#fff" opacity=".15"/>
<circle cx="60" cy="170" r="9" fill="#fff" opacity=".18"/>
<rect width="${CW}" height="${CH}" fill="url(#${u}g)"/>
<path d="M0 292 Q150 258 ${CW} 296 L${CW} ${CH} L0 ${CH} Z" fill="${shade(bg,.44)}" opacity=".5"/>
${art}
<rect width="${CW}" height="${CH}" fill="url(#${u}v)"/>
${subT}${mainT}
</g>
<rect x="0" y="${CH-CBAND}" width="${CW}" height="${CBAND}" fill="${escapeAttr(acc)}"/>
<rect x="0" y="${CH-CBAND}" width="${CW}" height="4" fill="${shade(bg,.4)}"/>
<text x="13" y="${CH-12}" font-size="15" font-weight="800" fill="#231F1A" font-family='${F_THIN}'>${escapeHtml(author)}</text>
<text x="${CW-13}" y="${CH-13}" font-size="10" font-weight="700" text-anchor="end" fill="#5A5044" font-family='${F_THIN}'>${escapeHtml(cat)}</text>
</svg>`;
}
function rowEl(it){

  const tags=(it.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');
  const upd=it.updated||it.created||'';
  const d=document.createElement('div');d.className='row'+(isNew(it)?' hasnew':'');

    <div class="cover">${coverSvg(it)}</div>
    <div class="body">
      <p class="rt">${escapeHtml(it.ranobe_title||it.name)}</p>
      <div class="byline">原作: <b>${escapeHtml(it.name)}</b> ／ ${escapeHtml(it.category||'')}</div>
      <p class="syn">${escapeHtml(it.synopsis||it.oneliner||'')}</p>
      ${tags?`<div class="tags">${tags}</div>`:''}

function section(title,count){
  const sec=document.createElement('div');
  sec.innerHTML=`<div class="cat"><h2>${escapeHtml(title)}</h2><span class="count">${count}作品</span></div>`;
  return sec;
}
function render(){
  const items=DATA.items.filter(matches);
  const root=document.getElementById('cards');root.innerHTML='';
  if(!items.length){root.innerHTML='<div class="empty">この棚には見つからなかった。条件を外してみて</div>';return;}
  if(sortMode==='new'){
    // 新着順: カテゴリをまたいで新しいもの順にフラット表示
    const sorted=items.slice().sort(cmpNew);
    const sec=section('🆕 新着の連載',sorted.length);
    const grid=document.createElement('div');grid.className='shelf';
    sorted.forEach(it=>grid.appendChild(rowEl(it)));
    sec.appendChild(grid);root.appendChild(sec);
  }else{
    // カテゴリ別: カテゴリは「最新作を含む順」、各カテゴリ内も新しい順
    const newestOf=c=>DATA.items.filter(i=>i.category===c)
      .reduce((m,i)=>(i.created||'')>m?(i.created||''):m,'');
    const cats=[...new Set(DATA.items.map(i=>i.category))]
      .sort((a,b)=>newestOf(b).localeCompare(newestOf(a)));
    cats.forEach(cat=>{
      const list=items.filter(i=>i.category===cat).sort(cmpNew);if(!list.length)return;
      const sec=section(cat,list.length);
      const grid=document.createElement('div');grid.className='shelf';
      list.forEach(it=>grid.appendChild(rowEl(it)));
      sec.appendChild(grid);root.appendChild(sec);
    });
  }
}

  paintSort();
  sortChip.onclick=()=>{sortMode=sortMode==='new'?'cat':'new';localStorage.setItem('cm_sort',sortMode);paintSort();render();};
  w.appendChild(sortChip);

    const pm=document.createElement('span');

    paintPm();

      pm.classList.toggle('on',presentMode);paintPm();render();};

  }
}
function buildChips(){
  const sw=document.getElementById('statusChips');

    const c=document.createElement('span');c.className='chip';
    c.textContent=(STATUS_META[s]||{}).label||s;
    c.onclick=()=>{activeStatus=activeStatus===s?null:s;syncChips();render();};c.dataset.s=s;sw.appendChild(c);});
  const cw=document.getElementById('catChips');
  [...new Set(DATA.items.map(i=>i.category))].forEach(cat=>{
    const c=document.createElement('span');c.className='chip';c.textContent=cat;
    c.onclick=()=>{activeCat=activeCat===cat?null:cat;syncChips();render();};c.dataset.c=cat;cw.appendChild(c);});
}
