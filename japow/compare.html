<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAPOW Site Three Ways</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#faf8f4;font-family:"Zen Kaku Gothic New",system-ui,sans-serif;color:#14213d}
header{position:sticky;top:0;background:#14213d;color:#fff;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px 16px;z-index:2}
header div{font-weight:900;font-size:15px}header small{display:block;font-weight:500;opacity:.8;font-size:12.5px;line-height:1.6;margin-top:3px}
.y{color:#facc15}.g{color:#7ee2b8}.c{color:#67e8f9}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px 16px;align-items:start}
.cols img{width:100%;display:block;border-radius:10px;background:#fff}
.note{padding:10px 16px 28px;font-size:13.5px;color:#4d5873;line-height:1.9}
.note a{color:#6d28d9}
@media(max-width:820px){header,.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="y">現サイト<small>japow-agent.studio.site</small></div>
<div class="g">A案 大胆<small>到着ボード＋搭乗券。別モチーフに作り替え</small></div>
<div class="c">B案 寄せ<small>今の見た目のまま機能を5つ追加</small></div>
</header>
<div class="cols"><img src="before.jpg" alt="現サイト"><img src="after.jpg" alt="A案"><img src="afterb.jpg" alt="B案"></div>
<p class="note">
3つともPC幅1280pxで撮影。実物は <a href="site/index.html">A案</a> ／ <a href="site-b/index.html">B案</a>。<br>
B案が足した機能: 5問の事前診断・7日チェックリスト・料金シミュレーター・市役所の持ち物リスト・ツアー事前フォームへの導線。
</p>
</body>
</html>
